[workspace]
name = "flight-energy-mcp"
version = "0.1.0"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
mojo = "==1.1.0"

[tasks]
build-server = "cargo build --locked --package energy-mcp --target-dir target"
build-driver = "mkdir -p build && mojo build mojo/main.mojo -o build/flight-energy-demo"
demo = { cmd = "./build/flight-energy-demo", env = { MOJO_PYTHON = "/usr/bin/python3" }, depends-on = ["build-server", "build-driver"] }
test-demo = { cmd = "python -m unittest discover -s tests -v", env = { MOJO_PYTHON = "/usr/bin/python3" }, depends-on = ["build-server", "build-driver"] }
