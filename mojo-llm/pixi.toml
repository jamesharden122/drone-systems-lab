[workspace]
name = "mojo-llm"
version = "0.1.0"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
mojo = "==1.1.0"

[tasks]
build = "mkdir -p build && mojo build src/main.mojo -o build/mojo-llm"
smoke = { cmd = "./build/mojo-llm", depends-on = ["build"] }
